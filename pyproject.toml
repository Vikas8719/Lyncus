[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Lyncus"
version = "1.0.2"
description = "Multi-language code quality CLI — detects fake tests, hardcoded values, and dead code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
  "code-quality", "linter", "cli", "static-analysis",
  "multi-language", "security", "dead-code", "mutation-testing"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
authors = [
  {name = "Lyncus Team", email = "lyncus.tool@gmail.com"}
]

dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "defusedxml>=0.7.1",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
python = [
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "vulture>=2.11",
  "mutmut>=3.0,<4",
  "pytest-cov>=5.0",
  "pip-audit>=2.7",
  "radon>=6.0",
]
js = [
  # npm tools are installed globally via npm — listed here for docs only
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "twine>=5.1",
]

[project.urls]
Homepage      = "https://github.com/Vikas8719/Lyncus"
Documentation = "https://github.com/Vikas8719/Lyncus#readme"
Repository    = "https://github.com/Vikas8719/Lyncus"
"Bug Tracker" = "https://github.com/Vikas8719/Lyncus/issues"
Changelog     = "https://github.com/Vikas8719/Lyncus/CHANGELOG.md"

[project.scripts]
Lyncus = "Lyncus.cli:main"

# ── Ruff (replaces flake8 + isort + pyupgrade) ───────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"
src            = ["Lyncus", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "SIM",      # flake8-simplify
  "TCH",      # flake8-type-checking
]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["Lyncus"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version        = "3.11"
strict                = true
ignore_missing_imports = true
exclude               = ["tests/", "build/", "dist/"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths        = ["tests"]
asyncio_mode     = "auto"
addopts          = "-v --tb=short"
filterwarnings   = ["ignore::DeprecationWarning"]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["Lyncus"]
omit     = [
  # Test files
  "tests/*",
  "tests/**/*",
  # Config / generated
  "Lyncus/config/*",
  # Virtual envs
  ".venv/*",
  "venv/*",
  "env/*",
  # Build output
  "build/*",
  "dist/*",
  "*.egg-info/*",
  # Cache / tool dirs
  "__pycache__/*",
  ".mypy_cache/*",
  ".pytest_cache/*",
  ".ruff_cache/*",
  ".hypothesis/*",
  ".tox/*",
  ".nox/*",
  # Coverage reports themselves
  "htmlcov/*",
  "coverage/*",
  # Misc
  "migrations/*",
  "scripts/*",
  "setup.py",
]
branch   = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 70
exclude_lines  = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]

# ALWAYS_SKIP_MUTATION_TOOLS .
[tool.mutmut]
source_paths = ["Lyncus/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.Lyncus.tools.timeouts]

[tool.Lyncus.ignore]
paths = [
  "tests/",
  "README.md",
  "lyncus.egg-info/",
  ".hypothesis/",
  ".venv/",
  "venv/",
  "build/",
  "dist/",
  ".git/",
  "__pycache__/",
  "mutants/",
  ".mypy_cache/",
  ".ruff_cache/",
  ".pytest_cache/",
  "CHANGELOG.md",
  "LICENSE",
  "scripts/",
  "Lyncus/rules/",
]

[tool.Lyncus.ignore.rules_suppress]
security_virtual_env = true

[tool.Lyncus.hardcode]
check_magic_numbers = false

# ── Setuptools ────────────────────────────────────────────────────────────────
[tool.setuptools]
packages = [
  "Lyncus",
  "Lyncus.core",
  "Lyncus.languages",
  "Lyncus.config",
  "Lyncus.rules",
]

[tool.setuptools.package-data]
Lyncus = ["config/*.toml", "py.typed"]
